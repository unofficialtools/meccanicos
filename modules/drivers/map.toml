# What MeccanicOS does about each package of EndeavourOS's live ISO
# (endeavouros.txt, the snapshot we follow). Every package there has an
# entry here, and only those:
#
#   by = ["...", ...]   what provides it in MeccanicOS, each one checked on the
#                       live ISO by ./start drivers-check:
#                         "option:PATH"        the option is set (true, non-empty)
#                         "option:PATH~VALUE"  the list option contains VALUE
#                         "package:NAME"       a package of that name is installed
#                                              (system packages, firmware, graphics,
#                                              fonts, udev, NetworkManager plugins…)
#   skip = "why"        not shipped, and why (a decision, not an oversight)
#   note = "..."        anything else worth knowing
#
# Most hardware support is in modules/drivers.nix; the rest in iso.nix,
# desktop.nix and others.

# ---------------------------------------------------------------- BASE
