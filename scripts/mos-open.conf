# MeccanicOS `open` rules (system defaults): the one place that says which app
# opens which kind of file. The shell (`open`), yazi, mc, fzf AND double-click
# in Thunar / on the desktop all follow it (modules/shell.nix turns the MIME
# types below into the desktop's defaults; folders stay in Thunar there).
# Your own rules go in ~/.config/meccanicos/open.conf and are checked first:
# `open --config`. (Double-click uses your rules too, for the types listed here.)
#
# PATTERNS   COMMAND
#   PATTERNS  comma-separated: with "/" a MIME type (image/*), ending in ":"
#             a URL scheme (https:), otherwise a file-name glob (*.csv, any case).
#   COMMAND   %f = the file or URL, %d = its folder (file added at the end
#             when there is no %f). "term:" = a terminal program.
#   "#: Label" just above a rule names it in `open --list`.
# The first match wins; test a file with: open -n FILE

# Folders and web
#: Folders
inode/directory                                   term: yazi %f
#: Web links
http:,https:,file:                                brave %f
#: SVG drawings (local web pages are text: Jed; `open -a brave` for the browser)
*.svg,image/svg+xml                               brave %f

# Office documents (OnlyOffice)
#: Spreadsheets, CSV
*.csv,*.tsv,text/csv,text/tab-separated-values,*.ods,*.xls,*.xlsx,application/vnd.oasis.opendocument.spreadsheet,application/vnd.openxmlformats-officedocument.spreadsheetml.sheet,application/vnd.ms-excel   onlyoffice-desktopeditors %f
#: Word documents
*.doc,*.docx,*.odt,*.rtf,application/msword,application/vnd.oasis.opendocument.text,application/vnd.openxmlformats-officedocument.wordprocessingml.document,text/rtf   onlyoffice-desktopeditors %f
#: Presentations
*.ppt,*.pptx,*.odp,application/vnd.ms-powerpoint,application/vnd.oasis.opendocument.presentation,application/vnd.openxmlformats-officedocument.presentationml.presentation   onlyoffice-desktopeditors %f
#: PDF, e-books
*.pdf,*.epub,*.djvu,application/pdf,application/epub+zip,image/vnd.djvu   evince %f

# Pictures (Eye of GNOME: arrow keys go through the folder, Ctrl+P prints),
# video and music
#: Pictures
image/*                                           eog %f
#: Video, music
video/*,audio/*,*.mkv,*.webm,*.m3u,*.m3u8         celluloid %f

# Archives: list the contents
#: Archives (contents)
*.zip,*.7z,*.rar,*.tar,*.tgz,*.tar.*,*.iso,application/zip,application/x-7z-compressed,application/x-rar,application/x-tar,application/gzip,application/x-xz,application/x-bzip2,application/zstd   term: 7zz l %f | less

# Code and any other text: Jed (open -e for VSCodium)
#: Code, other text
text/*,application/xhtml+xml,application/json,application/xml,application/x-yaml,application/toml,application/javascript,application/x-shellscript,inode/x-empty   term: jed %f

# Anything else: the desktop's default app
#: Anything else
*                                                 xdg-open %f
