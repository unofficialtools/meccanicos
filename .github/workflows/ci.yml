name: CI
# The quick jobs (lint, eval, mos-usb) run on every push to any branch; the
# slow VM tests on pushes to main, and on demand.
on:
  push:
    branches: ["**"]
  pull_request:
  workflow_dispatch:
    inputs:
      vm-tests:
        description: Run the (slow) VM tests
        type: boolean
        default: true

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  lint:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - name: shellcheck (every severity, as the NixOS build checks its scripts)
        run: shellcheck start scripts/*.sh branding/samples.sh
      - name: pyflakes
        run: |
          python3 -m pip install --quiet pyflakes
          python3 -m pyflakes scripts/*.py scripts/mos/*.py scripts/lib/*.py branding/generate.py tests/*.py
      - name: tutorial scenes point only at their own bullets
        run: python3 tests/tutorial_points.py

  mos-usb:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: tools/mos-usb
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-go@v6
        with:
          go-version-file: tools/mos-usb/go.mod
      - name: gofmt
        run: test -z "$(gofmt -l . | tee /dev/stderr)"
      - name: go vet (Linux, Windows, macOS)
        run: |
          for os in linux windows darwin; do GOOS=$os go vet ./...; done
      - name: go test
        run: go test ./...
      - name: Build the five release binaries
        env:
          CGO_ENABLED: "0"
        run: |
          for t in windows/amd64 darwin/arm64 darwin/amd64 linux/amd64 linux/arm64; do
            GOOS=${t%/*} GOARCH=${t#*/} go build -trimpath -ldflags='-s -w' -o /dev/null .
          done

  eval:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: cachix/install-nix-action@v31
        with:
          extra_nix_config: experimental-features = nix-command flakes
      - name: Evaluate everything (no building)
        run: |
          nix flake check --no-build -L
          nix eval --raw .#packages.x86_64-linux.iso.drvPath

  vm-tests:
    # Building the ISO and booting it takes a while: run on main and on demand.
    if: (github.event_name == 'push' && github.ref == 'refs/heads/main') || (github.event_name == 'workflow_dispatch' && inputs.vm-tests)
    needs: [lint, eval, mos-usb]
    runs-on: ubuntu-latest
    timeout-minutes: 360
    strategy:
      fail-fast: false
      matrix:
        test: [live, install, ventoy]
    steps:
      - uses: actions/checkout@v7
      - uses: ./.github/actions/setup-nix
        with:
          cachix-name: ${{ vars.CACHIX_CACHE }}
          cachix-token: ${{ secrets.CACHIX_AUTH_TOKEN }}
      - name: Run VM test ${{ matrix.test }}
        run: nix build -L .#checks.x86_64-linux.${{ matrix.test }} --out-link test-${{ matrix.test }}
      - name: Upload screenshots
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: screenshots-${{ matrix.test }}
          path: test-${{ matrix.test }}/*.png
          if-no-files-found: ignore
