name: Release
# Push a tag like v2026-10-08 to build the ISO and publish it, under that tag
# and as the "latest" release (the README and get-iso point there).
# Only once CI (lint, evaluation, mos-usb's tests and, for a tag, the VM
# tests) has passed for that same commit. Run by hand (workflow_dispatch): the
# quick checks and a build, nothing published.
on:
  push:
    tags: ["v*"]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  published:
    runs-on: ubuntu-latest
    outputs:
      skip: ${{ steps.published.outputs.skip }}
    steps:
      - name: Already published? (a release made by hand, with its tag)
        id: published
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          if [[ $GITHUB_REF == refs/tags/* ]] && gh release view "$GITHUB_REF_NAME" -R "$GITHUB_REPOSITORY" >/dev/null 2>&1; then
            echo "skip=true" >> "$GITHUB_OUTPUT"
            echo "Release $GITHUB_REF_NAME exists already: nothing to build."
          fi

  ci:
    needs: published
    if: needs.published.outputs.skip != 'true'
    uses: ./.github/workflows/ci.yml
    with:
      vm-tests: ${{ startsWith(github.ref, 'refs/tags/') }}
    secrets: inherit

  iso:
    needs: [published, ci]
    if: needs.published.outputs.skip != 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 360
    permissions:
      contents: write # the release
      id-token: write # the build provenance (attestation) of its files
      attestations: write
    steps:
      - uses: actions/checkout@v7
      - uses: ./.github/actions/setup-nix
        with:
          cachix-name: ${{ vars.CACHIX_CACHE }}
          cachix-token: ${{ secrets.CACHIX_AUTH_TOKEN }}
      - name: Build the ISO
        # The tag (v2026-10-16) goes into the ISO's name and /etc/os-release,
        # with the commit and today's date and time into /etc/meccanicos/version
        # (see flake.nix). Run by hand (workflow_dispatch): the branch's name.
        run: |
          now=$(date -u +%Y%m%d%H%M)
          MECCANICOS_RELEASE=$GITHUB_REF_NAME MECCANICOS_BUILD_DATE=${now:0:8} MECCANICOS_BUILD_TIME=${now:8:4} \
            nix build -L --impure .#iso --out-link iso
      - name: Split into parts (GitHub release files must be under 2 GB)
        run: |
          set -euo pipefail
          src=$(ls iso/iso/*.iso)
          # Add its own hash to the name:
          #   meccanicos-v2026-10-16-26.05-x86_64-linux-git5b31f5e-sha1a2b3c4d.iso
          sum=$(sha256sum "$src" | cut -d' ' -f1)
          name="$(basename "$src" .iso)-sha${sum:0:8}.iso"
          mkdir -p dist
          echo "$sum  $name" > dist/SHA256SUMS
          split --bytes=1900M --numeric-suffixes=1 --suffix-length=2 "$src" "dist/$name.part"
          ( cd dist && sha256sum "$name".part* >> SHA256SUMS )
          echo "ISO_NAME=$name" >> "$GITHUB_ENV"
          # MeccanicOS-README.pdf: the instructions mos-usb puts next to the ISO on a
          # Ventoy stick. Optional: if it does not build, the release goes on without it.
          if nix build --impure .#readme-pdf --out-link readme; then
            cp readme dist/MeccanicOS-README.pdf
            ( cd dist && sha256sum MeccanicOS-README.pdf >> SHA256SUMS )
          else
            echo "::warning::MeccanicOS-README.pdf did not build; released without it"
          fi
          ls -lh dist
      - uses: actions/setup-go@v6
        with:
          go-version-file: tools/mos-usb/go.mod
          cache: false  # mos-usb has no dependencies: nothing to cache
      - name: Build mos-usb (makes the USB drive; downloaded from the release, not on the ISO)
        working-directory: tools/mos-usb
        run: |
          set -euo pipefail
          export CGO_ENABLED=0
          for t in windows/amd64/windows.exe darwin/arm64/macos-arm64 darwin/amd64/macos-x86_64 \
                   linux/amd64/linux-x86_64 linux/arm64/linux-arm64; do
            IFS=/ read -r os arch name <<<"$t"
            GOOS=$os GOARCH=$arch go build -trimpath -ldflags='-s -w' -o "../../dist/mos-usb-$name" .
          done
          cd ../../dist && sha256sum mos-usb-* >> SHA256SUMS
      - name: Provenance (gh attestation verify FILE -R unofficialtools/meccanicos)
        if: startsWith(github.ref, 'refs/tags/')
        # Every file in SHA256SUMS, the joined ISO too: built here, from this commit.
        uses: actions/attest-build-provenance@v3
        with:
          subject-checksums: dist/SHA256SUMS
      - name: Publish
        if: startsWith(github.ref, 'refs/tags/')
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          cat > notes.md <<NOTES
          ## Download

          **In one step** (downloads every part, resumes if interrupted, joins and checks them):

          - **Linux / macOS:** \`curl -fsSL https://raw.githubusercontent.com/unofficialtools/meccanicos/main/scripts/get-iso.sh | sh\`
          - **Windows (PowerShell):** \`irm https://raw.githubusercontent.com/unofficialtools/meccanicos/main/scripts/get-iso.ps1 | iex\`

          **By hand:** the ISO is split into parts because GitHub limits release files to 2 GB.
          Download **all** \`$ISO_NAME.partNN\` files and \`SHA256SUMS\`, then join them:

          - **Linux / macOS:** \`cat $ISO_NAME.part* > $ISO_NAME\`
          - **Windows (PowerShell):** \`cmd /c copy /b "$ISO_NAME.part*" "$ISO_NAME"\`

          Check it: \`sha256sum -c SHA256SUMS --ignore-missing\` (macOS: \`shasum -a 256 -c SHA256SUMS --ignore-missing\`).
          Then write it to a USB stick — see [Writing the USB stick](../../#2-write-it-to-a-usb-stick).

          **Easiest:** \`mos-usb\` downloads the ISO, makes a USB drive bootable (with Ventoy) and copies
          MeccanicOS onto it — see [Make a USB drive](https://github.com/unofficialtools/meccanicos#1-make-a-usb-drive).

          This release is commit \`${GITHUB_SHA:0:7}\`; the ISO's name says so (\`git${GITHUB_SHA:0:7}\`) and
          ends with the start of its own SHA-256 (\`sha…\`). Installed computers get it with \`mos-upgrade\`,
          or this very release with \`mos-upgrade --to $GITHUB_REF_NAME\`.

          **MeccanicOS-README.pdf**: how to start a computer from the USB drive, and the firmware (BIOS) settings
          if it does not; it is on every MeccanicOS USB drive too.

          More: [meccanicos.com](https://meccanicos.com). Support: [the MeccanicOS group](https://groups.google.com/g/meccanicos).
          NOTES
          gh release create "$GITHUB_REF_NAME" dist/* --title "$GITHUB_REF_NAME" --notes-file notes.md --latest=false

  latest:
    # The same files again as "latest" (moved to this commit), which the
    # README, get-iso, mos-usb and mos-upgrade use. One run at a time; a run
    # still waiting is replaced by a newer one, which moves it further anyway.
    needs: iso
    if: startsWith(github.ref, 'refs/tags/')
    runs-on: ubuntu-latest
    concurrency:
      group: release-latest
      cancel-in-progress: false
    permissions:
      contents: write
    env:
      GH_TOKEN: ${{ github.token }}
      GH_REPO: ${{ github.repository }}
    steps:
      - name: Move "latest" to this release (never back to an older one)
        run: |
          set -euo pipefail
          tag=$GITHUB_REF_NAME repo=repos/$GITHUB_REPOSITORY
          # The newest release is the highest version (as mos-upgrade sorts
          # them): a run for an older tag that finishes later leaves it alone.
          newest=$(gh api "$repo/releases" --paginate --jq '.[] | select(.draft | not) | .tag_name' | grep '^v' | sort -V | tail -n1)
          if [[ $newest != "$tag" ]]; then
            echo "$newest is newer than $tag: latest stays where it is."
            exit 0
          fi
          mkdir dist && gh release download "$tag" -D dist
          gh release view "$tag" --json body --jq .body > notes.md
          if ! gh release view latest >/dev/null 2>&1; then  # the first one
            gh release create latest dist/* --target "$GITHUB_SHA" --title "Latest: $tag" --notes-file notes.md --latest
            exit 0
          fi
          id=$(gh api "$repo/releases/tags/latest" --jq .id)
          asset() { gh api "$repo/releases/$id/assets" --paginate --jq ".[] | select(.name == \"$1\") | .id"; }
          # The files that clients may be downloading now (named in the old SHA256SUMS) stay
          # until the next release; older ones go at the end.
          gh release download latest -p SHA256SUMS -O previous.sums 2>/dev/null || : > previous.sums
          # A file already there is replaced without a moment when it is
          # missing: uploaded under another name, the old one deleted, the new renamed.
          put() {
            local f=$1 old new
            old=$(asset "$f")
            if [[ -z $old ]]; then
              gh release upload latest "dist/$f"
              return
            fi
            ln "dist/$f" "dist/next.$f"
            gh release upload latest "dist/next.$f"
            new=$(asset "next.$f")
            gh api -X DELETE "$repo/releases/assets/$old"
            gh api -X PATCH "$repo/releases/assets/$new" -f name="$f" >/dev/null
            rm "dist/next.$f"
          }
          # New files first, SHA256SUMS (which names the parts to fetch) last.
          for f in dist/*; do
            [[ $f == dist/SHA256SUMS ]] || put "${f#dist/}"
          done
          put SHA256SUMS
          # The tag (what mos-upgrade follows) moves in one step. GitHub
          # refuses this token a tag on a commit that changes .github/workflows
          # (or a tag ruleset may): the release keeps its new files, never
          # deleted (its own new tag would be refused too), and the run fails
          # with what to do.
          moved=true
          gh api -X PATCH "$repo/git/refs/tags/latest" -f sha="$GITHUB_SHA" -F force=true >/dev/null || moved=false
          gh release edit latest --title "Latest: $tag" --notes-file notes.md --latest
          keep=$( (ls dist; awk '{ print $2 }' previous.sums) | sort -u)
          gh api "$repo/releases/$id/assets" --paginate --jq '.[] | "\(.id) \(.name)"' |
            while read -r a name; do
              grep -qxF "$name" <<<"$keep" || gh api -X DELETE "$repo/releases/assets/$a"
            done
          if ! $moved; then
            echo "::error::latest has $tag's files, but its tag could not be moved (mos-upgrade follows the tag). By hand: git tag -f latest $GITHUB_SHA && git push -f origin refs/tags/latest"
            exit 1
          fi
